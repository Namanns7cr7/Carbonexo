[project]
name = "carbonexo-backend"
version = "0.1.0"
description = "Carbonexo backend — Python/FastAPI rewrite of the Java/Spring Boot backend (Phase 1: core parity)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",
    "google-auth>=2.34",
    "google-cloud-aiplatform>=1.60",
    "google-cloud-vision>=3.7",
    "pytesseract>=0.3.10",
    "Pillow>=10.4",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as a default argument is the documented,
# idiomatic pattern (not the "mutable default"/expensive-call footgun this
# rule targets) — ignore it rather than fighting the framework's own style.
ignore = ["B008"]
